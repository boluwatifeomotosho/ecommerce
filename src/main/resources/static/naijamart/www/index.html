<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' https://ecommerce-production-9470.up.railway.app https://ngcloak-production.up.railway.app;
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data:;" />
    <title>NaijaMart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #16a34a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: white;
        }

        .logo-wrap {
            width: 96px;
            height: 96px;
            background: rgba(255,255,255,0.15);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            backdrop-filter: blur(4px);
        }

        .logo-letter {
            font-size: 56px;
            font-weight: 900;
            color: white;
            line-height: 1;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 48px;
        }

        .spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #status {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="logo-wrap">
        <span class="logo-letter">N</span>
    </div>
    <h1>NaijaMart</h1>
    <p class="tagline">Nigeria's online marketplace</p>

    <div class="spinner-wrap">
        <div class="spinner"></div>
        <p id="status">Loading...</p>
    </div>

    <script src="cordova.js"></script>
    <script>
        (function () {
            "use strict";

            var TARGET_URL = "https://ecommerce-production-9470.up.railway.app/mobile";

            function launch() {
                document.getElementById("status").textContent = "Connecting...";
                window.location.replace(TARGET_URL);
            }

            // Launch once Cordova device APIs are ready
            document.addEventListener("deviceready", launch, false);

            // Fallback: if Cordova doesn't fire (e.g. browser preview), launch after 1.5s
            window.setTimeout(function () {
                if (window.location.href.indexOf("naijamart") === -1) return; // already redirected
                launch();
            }, 1500);
        })();
    </script>
</body>
</html>
