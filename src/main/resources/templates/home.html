<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Welcome | NaijaMart</title>
    <th:block th:replace="~{fragments/head :: resources}" />
</head>
<body class="bg-surface-bright min-h-screen flex items-center justify-center">
    <div class="bg-surface-container-lowest rounded-2xl p-12 text-center max-w-md w-[90%] shadow-[0px_20px_60px_rgba(99,14,212,0.12)] border border-outline-variant/30">
        <div class="w-16 h-16 bg-primary rounded-2xl inline-flex items-center justify-center mb-5 shadow-lg shadow-primary/30">
            <span class="material-symbols-outlined text-3xl text-on-primary">storefront</span>
        </div>
        <h1 class="text-xl font-bold text-primary mb-2">NaijaMart</h1>
        <p class="text-sm text-on-surface-variant mb-7 leading-relaxed">
            Welcome, <span class="font-bold text-on-surface" th:text="${name}">User</span>!<br/>
            You're signed in as <span th:text="${email}">user@email.com</span>.
        </p>
        <a href="/customer/dashboard" class="inline-block px-8 py-3 bg-primary text-on-primary font-bold text-sm rounded-lg shadow-md shadow-primary/20 hover:opacity-90 transition-all active:scale-95">
            Go to Dashboard
        </a>
        <form th:action="@{/logout}" method="post" class="mt-3">
            <button type="submit" class="w-full py-2.5 text-error border border-error/30 rounded-lg text-sm font-bold hover:bg-error/5 transition-colors">
                Sign Out
            </button>
        </form>
    </div>
</body>
</html>
