<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pending Review — Admin | NaijaMart</title>
    <th:block th:replace="~{fragments/head :: resources}" />
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden">

<!-- Sidebar -->
<aside th:replace="~{fragments/admin-sidebar :: sidebar('pending', 'Admin', '')}"></aside>

<!-- Main -->
<div class="ml-0 md:ml-[280px] mt-16 md:mt-0 flex-1 p-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-on-surface">Pending Review</h1>
            <p class="text-sm text-on-surface-variant mt-1" th:text="'Total: ' + ${products.totalElements} + ' products awaiting review'"></p>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-800 rounded-lg text-sm" th:text="${success}"></div>
    <div th:if="${error}"   class="mb-4 px-4 py-3 bg-red-50   border border-red-200   text-red-800   rounded-lg text-sm" th:text="${error}"></div>

    <!-- Table -->
    <div class="bg-surface-container-lowest rounded-2xl shadow-[0px_4px_20px_rgba(30,41,59,0.05)] overflow-hidden border border-outline-variant">
        <table class="w-full text-sm" th:if="${!products.empty}">
            <thead class="bg-surface-container-low border-b border-outline-variant">
            <tr>
                <th class="text-left px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Product</th>
                <th class="text-left px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Category</th>
                <th class="text-left px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Vendor</th>
                <th class="text-right px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Price</th>
                <th class="text-right px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Stock</th>
                <th class="text-center px-6 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Action</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-outline-variant/30">
            <tr th:each="p : ${products.content}" class="hover:bg-surface-container-low transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <img th:if="${p.primaryImageUrl}" th:src="${p.primaryImageUrl}" th:alt="${p.name}"
                             class="w-12 h-12 rounded-lg object-cover border border-outline-variant"/>
                        <div th:unless="${p.primaryImageUrl}" class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">
                            <span class="material-symbols-outlined text-[20px]">image</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <p class="font-medium text-on-surface truncate max-w-[200px]" th:text="${p.name}"></p>
                                <span th:if="${p.status.name() == 'PENDING_EDIT'}"
                                      class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-700">Edit</span>
                                <span th:if="${p.status.name() == 'PENDING_REVIEW'}"
                                      class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-100 text-blue-700">New</span>
                            </div>
                            <p class="text-xs text-on-surface-variant mt-0.5">ID: <span th:text="${#strings.abbreviate(p.id.toString(), 16)}"></span></p>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 text-on-surface-variant" th:text="${p.categoryName}"></td>
                <td class="px-6 py-4 text-on-surface-variant" th:text="${p.vendorName}"></td>
                <td class="px-6 py-4 text-right font-semibold text-on-surface">
                    &#8358;<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></span>
                </td>
                <td class="px-6 py-4 text-right text-on-surface-variant" th:text="${p.stockQuantity}"></td>
                <td class="px-6 py-4 text-center">
                    <a th:href="@{/admin/products/pending/{id}(id=${p.id})}"
                       class="inline-flex items-center gap-1 px-3 py-1.5 bg-primary/5 text-primary border border-primary/30 rounded-lg text-xs font-medium hover:bg-primary/10 transition-colors">
                        <span class="material-symbols-outlined text-[14px]">visibility</span>Review
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Empty state -->
        <div th:if="${products.empty}" class="flex flex-col items-center justify-center py-16 text-on-surface-variant">
            <span class="material-symbols-outlined text-5xl mb-3">check_circle</span>
            <p class="font-medium text-on-surface-variant">All caught up!</p>
            <p class="text-sm mt-1">No products are pending review.</p>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${products.totalPages > 1}" class="flex items-center justify-between mt-4">
        <p class="text-sm text-on-surface-variant">
            Page <span th:text="${products.number + 1}"></span> of <span th:text="${products.totalPages}"></span>
        </p>
        <div class="flex gap-2">
            <a th:if="${!products.first}"
               th:href="@{/admin/products/pending(page=${products.number - 1})}"
               class="px-3 py-1.5 text-sm border border-outline-variant rounded-lg hover:bg-surface-container-low">&larr; Previous</a>
            <a th:if="${!products.last}"
               th:href="@{/admin/products/pending(page=${products.number + 1})}"
               class="px-3 py-1.5 text-sm border border-outline-variant rounded-lg hover:bg-surface-container-low">Next &rarr;</a>
        </div>
    </div>
</div>
</body>
</html>
