<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pending Review — Admin | NaijaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-rounded { vertical-align: middle; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

<!-- Sidebar -->
<aside class="w-64 bg-gray-900 min-h-screen flex flex-col fixed top-0 left-0 z-40">
    <div class="px-6 py-5 border-b border-gray-700">
        <span class="text-xl font-bold text-white">Naija<span class="text-orange-500">Mart</span></span>
        <p class="text-xs text-gray-400 mt-0.5">Admin Panel</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
        <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors text-sm">
            <span class="material-symbols-rounded text-[20px]">dashboard</span>Dashboard
        </a>
        <a th:href="@{/admin/products/pending}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-orange-600 text-white text-sm">
            <span class="material-symbols-rounded text-[20px]">rate_review</span>Pending Review
        </a>
    </nav>
    <div class="px-3 py-4 border-t border-gray-700">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="flex items-center gap-3 w-full px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg text-sm transition-colors">
                <span class="material-symbols-rounded text-[20px]">logout</span>Logout
            </button>
        </form>
    </div>
</aside>

<!-- Main -->
<div class="ml-64 flex-1 p-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Pending Review</h1>
            <p class="text-sm text-gray-500 mt-1" th:text="'Total: ' + ${products.totalElements} + ' products awaiting review'"></p>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-800 rounded-lg text-sm" th:text="${success}"></div>
    <div th:if="${error}"   class="mb-4 px-4 py-3 bg-red-50   border border-red-200   text-red-800   rounded-lg text-sm" th:text="${error}"></div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
        <table class="w-full text-sm" th:if="${!products.empty}">
            <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Product</th>
                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th>
                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Vendor</th>
                <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Price</th>
                <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th>
                <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Action</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="p : ${products.content}" class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <img th:if="${p.primaryImageUrl}" th:src="${p.primaryImageUrl}" th:alt="${p.name}"
                             class="w-12 h-12 rounded-lg object-cover border border-gray-200"/>
                        <div th:unless="${p.primaryImageUrl}" class="w-12 h-12 rounded-lg bg-gray-100 flex items-center justify-center text-gray-400">
                            <span class="material-symbols-rounded text-[20px]">image</span>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 truncate max-w-[200px]" th:text="${p.name}"></p>
                            <p class="text-xs text-gray-400 mt-0.5">ID: <span th:text="${#strings.abbreviate(p.id.toString(), 16)}"></span></p>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 text-gray-600" th:text="${p.categoryName}"></td>
                <td class="px-6 py-4 text-gray-600" th:text="${p.vendorName}"></td>
                <td class="px-6 py-4 text-right font-semibold text-gray-900">
                    ₦<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></span>
                </td>
                <td class="px-6 py-4 text-right text-gray-600" th:text="${p.stockQuantity}"></td>
                <td class="px-6 py-4 text-center">
                    <a th:href="@{/admin/products/pending/{id}(id=${p.id})}"
                       class="inline-flex items-center gap-1 px-3 py-1.5 bg-orange-50 text-orange-700 border border-orange-200 rounded-lg text-xs font-medium hover:bg-orange-100 transition-colors">
                        <span class="material-symbols-rounded text-[14px]">visibility</span>Review
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Empty state -->
        <div th:if="${products.empty}" class="flex flex-col items-center justify-center py-16 text-gray-400">
            <span class="material-symbols-rounded text-5xl mb-3">check_circle</span>
            <p class="font-medium text-gray-600">All caught up!</p>
            <p class="text-sm mt-1">No products are pending review.</p>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${products.totalPages > 1}" class="flex items-center justify-between mt-4">
        <p class="text-sm text-gray-500">
            Page <span th:text="${products.number + 1}"></span> of <span th:text="${products.totalPages}"></span>
        </p>
        <div class="flex gap-2">
            <a th:if="${!products.first}"
               th:href="@{/admin/products/pending(page=${products.number - 1})}"
               class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">← Previous</a>
            <a th:if="${!products.last}"
               th:href="@{/admin/products/pending(page=${products.number + 1})}"
               class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Next →</a>
        </div>
    </div>
</div>
</body>
</html>
