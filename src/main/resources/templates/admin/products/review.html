<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Review: ' + ${product.name} + ' | NaijaMart Admin'">Review Product | NaijaMart Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; } .material-symbols-rounded { vertical-align: middle; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex">

<!-- Sidebar (same as pending.html) -->
<aside class="w-64 bg-gray-900 min-h-screen flex flex-col fixed top-0 left-0 z-40">
    <div class="px-6 py-5 border-b border-gray-700">
        <span class="text-xl font-bold text-white">Naija<span class="text-orange-500">Mart</span></span>
        <p class="text-xs text-gray-400 mt-0.5">Admin Panel</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
        <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors text-sm">
            <span class="material-symbols-rounded text-[20px]">dashboard</span>Dashboard
        </a>
        <a th:href="@{/admin/products/pending}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors text-sm">
            <span class="material-symbols-rounded text-[20px]">rate_review</span>Pending Review
        </a>
    </nav>
    <div class="px-3 py-4 border-t border-gray-700">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="flex items-center gap-3 w-full px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg text-sm transition-colors">
                <span class="material-symbols-rounded text-[20px]">logout</span>Logout
            </button>
        </form>
    </div>
</aside>

<!-- Main -->
<div class="ml-64 flex-1 p-8">
    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/products/pending}" class="text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Review Product</h1>
            <p class="text-sm text-gray-500">Submitted by <span class="font-medium" th:text="${product.vendorName}"></span></p>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-6">
        <!-- Product details -->
        <div class="col-span-2 space-y-5">

            <!-- Images -->
            <div class="bg-white rounded-xl border border-gray-200 p-5" th:if="${!product.images.empty}">
                <h2 class="text-sm font-semibold text-gray-700 mb-3">Images</h2>
                <div class="flex gap-3 flex-wrap">
                    <img th:each="img : ${product.images}"
                         th:src="${img.url}"
                         th:alt="${img.altText}"
                         class="w-28 h-28 object-cover rounded-lg border border-gray-200"/>
                </div>
            </div>

            <!-- Core info -->
            <div class="bg-white rounded-xl border border-gray-200 p-5">
                <h2 class="text-xl font-bold text-gray-900 mb-1" th:text="${product.name}"></h2>
                <p class="text-sm text-orange-600 mb-3" th:text="${product.category.name}"></p>
                <div class="flex items-baseline gap-3 mb-4">
                    <span class="text-2xl font-bold text-gray-900">₦<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></span></span>
                    <span th:if="${product.isOnSale()}" class="text-sm text-gray-400 line-through">
                        ₦<span th:text="${#numbers.formatDecimal(product.compareAtPrice, 1, 'COMMA', 2, 'POINT')}"></span>
                    </span>
                </div>
                <div class="prose prose-sm text-gray-700 border-t border-gray-100 pt-4" th:text="${product.description}"></div>
            </div>

            <!-- Details table -->
            <div class="bg-white rounded-xl border border-gray-200 p-5">
                <h2 class="text-sm font-semibold text-gray-700 mb-3">Product Details</h2>
                <dl class="grid grid-cols-2 gap-3 text-sm">
                    <div class="bg-gray-50 rounded-lg p-3">
                        <dt class="text-xs text-gray-400 uppercase tracking-wider">SKU</dt>
                        <dd class="font-medium text-gray-800 mt-0.5" th:text="${product.sku ?: '—'}"></dd>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <dt class="text-xs text-gray-400 uppercase tracking-wider">Stock</dt>
                        <dd class="font-medium text-gray-800 mt-0.5" th:text="${product.stockQuantity} + ' units'"></dd>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <dt class="text-xs text-gray-400 uppercase tracking-wider">Weight</dt>
                        <dd class="font-medium text-gray-800 mt-0.5" th:text="${product.weightGrams != null} ? ${product.weightGrams} + 'g' : '—'"></dd>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <dt class="text-xs text-gray-400 uppercase tracking-wider">Submitted</dt>
                        <dd class="font-medium text-gray-800 mt-0.5" th:text="${#temporals.format(product.updatedAt, 'dd MMM yyyy')}"></dd>
                    </div>
                </dl>
            </div>
        </div>

        <!-- Decision panel -->
        <div class="space-y-4">
            <!-- Approve -->
            <div class="bg-white rounded-xl border border-gray-200 p-5">
                <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-2">
                    <span class="material-symbols-rounded text-green-600 text-[20px]">check_circle</span>Approve
                </h3>
                <p class="text-xs text-gray-500 mb-4">Publishing will make this product visible to all customers immediately.</p>
                <form th:action="@{/admin/products/{id}/approve(id=${product.id})}" method="post">
                    <button type="submit"
                            onclick="return confirm('Approve and publish this product?')"
                            class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-semibold transition-colors">
                        Approve &amp; Publish
                    </button>
                </form>
            </div>

            <!-- Reject -->
            <div class="bg-white rounded-xl border border-gray-200 p-5">
                <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-2">
                    <span class="material-symbols-rounded text-red-500 text-[20px]">cancel</span>Reject
                </h3>
                <form th:action="@{/admin/products/{id}/reject(id=${product.id})}" method="post">
                    <label class="block text-xs text-gray-500 mb-1">Reason for rejection <span class="text-red-500">*</span></label>
                    <textarea name="reason" rows="4" required placeholder="Explain what the vendor needs to fix..."
                              class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-300 resize-none mb-3"></textarea>
                    <button type="submit"
                            class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold transition-colors">
                        Reject Product
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
