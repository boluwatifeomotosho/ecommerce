<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>New paid order</title></head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:Arial,Helvetica,sans-serif;color:#1c1b1f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 12px;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.05);">
            <tr><td style="padding:32px 32px 8px 32px;">
                <div style="display:inline-block;background:#e8f5e9;color:#1b5e20;font-size:11px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;padding:4px 10px;border-radius:999px;">Paid</div>
                <h1 style="margin:16px 0 0 0;font-size:22px;color:#1c1b1f;">New paid order</h1>
                <p style="margin:8px 0 0 0;font-size:14px;color:#49454f;line-height:1.55;">
                    <span th:text="${recipientLabel ?: 'You'}">You</span> received a new paid order
                    <strong th:text="${orderRef}">REF</strong> from
                    <strong th:text="${customerName ?: 'a customer'}">Customer</strong>.
                </p>
            </td></tr>
            <tr><td style="padding:24px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e7e0ec;border-radius:12px;">
                    <tr><td style="padding:16px 20px;border-bottom:1px solid #e7e0ec;">
                        <strong style="font-size:14px;color:#1c1b1f;">Items</strong>
                    </td></tr>
                    <tr th:each="item : ${items}"><td style="padding:12px 20px;border-bottom:1px solid #f1eaf4;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="font-size:14px;color:#1c1b1f;">
                                    <div th:text="${item.productName}">Product</div>
                                    <div style="font-size:12px;color:#79747e;margin-top:2px;">
                                        Sold by <span th:text="${item.vendorName ?: 'Marketplace'}">Vendor</span> ·
                                        <span th:text="${item.quantity}">1</span> ×
                                        &#8358;<span th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                                    </div>
                                </td>
                                <td align="right" style="font-size:14px;font-weight:bold;color:#1c1b1f;white-space:nowrap;">
                                    &#8358;<span th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                                </td>
                            </tr>
                        </table>
                    </td></tr>
                    <tr><td style="padding:16px 20px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr><td style="font-size:15px;font-weight:bold;color:#1c1b1f;">Order total</td>
                                <td align="right" style="font-size:15px;font-weight:bold;color:#65558f;">
                                    &#8358;<span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">0.00</span></td></tr>
                        </table>
                    </td></tr>
                </table>
            </td></tr>
            <tr><td style="padding:0 32px 24px 32px;">
                <p style="margin:0 0 6px 0;font-size:13px;font-weight:bold;color:#1c1b1f;">Ship to</p>
                <p style="margin:0;font-size:13px;color:#49454f;line-height:1.5;">
                    <span th:text="${shippingName}">Name</span> ·
                    <span th:text="${shippingPhone}">Phone</span><br/>
                    <span th:text="${shippingAddress + ', ' + shippingCity + ', ' + shippingState}">Address</span>
                </p>
            </td></tr>
            <tr><td align="center" style="padding:0 32px 32px 32px;">
                <a th:href="${orderUrl}" style="display:inline-block;background:#65558f;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:12px 28px;border-radius:12px;">
                    Open Order
                </a>
            </td></tr>
            <tr><td style="padding:20px 32px;background:#f5f5f7;text-align:center;font-size:11px;color:#79747e;">
                Pinepetosan Marketplace · This is an automated notification.
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
