<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register with Phone — NaijaMart</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a0a00 0%, #3d1f08 40%, #6b3a1f 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .25; animation: orbFloat 8s ease-in-out infinite; pointer-events: none; }
        .orb-1 { width: 400px; height: 400px; background: #ff8c00; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #c0392b; bottom: -80px; right: -60px; animation-delay: -3s; }
        .orb-3 { width: 200px; height: 200px; background: #e67e22; top: 50%; left: 50%; animation-delay: -6s; }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-30px) scale(1.07); }
        }

        .card {
            position: relative; z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 44px 40px;
            width: 100%; max-width: 420px;
            animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo { text-align: center; margin-bottom: 28px; }
        .logo span { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .logo span em { color: #ff8c00; font-style: normal; }

        h2  { color: #fff; font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
        .sub { color: rgba(255,255,255,0.55); font-size: 0.875rem; margin-bottom: 24px; }

        .alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; font-size: 0.875rem; }
        .alert-error { background: rgba(220,53,69,0.2); border: 1px solid rgba(220,53,69,0.4); color: #ff8080; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.65); margin-bottom: 6px; letter-spacing: 0.03em; }
        input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus  { border-color: #ff8c00; background: rgba(255,255,255,0.14); }
        input.invalid { border-color: #ff6b6b; }
        input.valid   { border-color: #4caf50; }

        .field-hint { font-size: 0.75rem; color: #ff6b6b; margin-top: 4px; display: none; }
        .field-hint.show { display: block; }

        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #ff8c00, #e65c00);
            color: #fff; font-size: 1rem; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s; margin-top: 8px;
        }
        .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .divider { text-align: center; color: rgba(255,255,255,0.35); font-size: 0.8rem; margin: 20px 0; }
        .links { text-align: center; }
        .links a { color: #ff8c00; text-decoration: none; font-size: 0.875rem; }
        .links a:hover { text-decoration: underline; }
        .links span { color: rgba(255,255,255,0.45); font-size: 0.875rem; }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
    <div class="logo"><span>Naija<em>Mart</em></span></div>
    <h2>Register with Phone</h2>
    <p class="sub">Enter your details and we'll send a verification code to your number.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form id="regForm" th:action="@{/register/phone}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row">
            <div class="field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Ada" required autocomplete="given-name"/>
                <div class="field-hint" id="firstNameHint">Required</div>
            </div>
            <div class="field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Obi" required autocomplete="family-name"/>
                <div class="field-hint" id="lastNameHint">Required</div>
            </div>
        </div>

        <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="08012345678 or +2348012345678" required autocomplete="tel"/>
            <div class="field-hint" id="phoneHint">Enter a valid Nigerian mobile number</div>
        </div>

        <button type="submit" class="btn" id="submitBtn" disabled>Send Verification Code</button>
    </form>

    <div class="divider">or</div>
    <div class="links">
        <span>Already have an account?</span>
        <a th:href="@{/login}" style="margin-left:6px;">Log in</a>
    </div>
    <div class="links" style="margin-top:10px;">
        <a th:href="@{/register/customer}">Register with email instead</a>
    </div>
</div>

<script>
    const PHONE_RE = /^(\+?234|0)[789]\d{9}$/;
    const $ = id => document.getElementById(id);
    const state = { firstName: false, lastName: false, phone: false };

    function setField(id, valid) {
        $(id).classList.toggle('valid',   valid);
        $(id).classList.toggle('invalid', !valid);
    }

    function updateSubmit() {
        $('submitBtn').disabled = !Object.values(state).every(Boolean);
    }

    $('firstName').addEventListener('input', e => {
        state.firstName = e.target.value.trim().length >= 2;
        setField('firstName', state.firstName);
        $('firstNameHint').classList.toggle('show', !state.firstName && e.target.value.length > 0);
        updateSubmit();
    });

    $('lastName').addEventListener('input', e => {
        state.lastName = e.target.value.trim().length >= 2;
        setField('lastName', state.lastName);
        $('lastNameHint').classList.toggle('show', !state.lastName && e.target.value.length > 0);
        updateSubmit();
    });

    $('phone').addEventListener('input', e => {
        const v = e.target.value.trim();
        state.phone = PHONE_RE.test(v.replace(/\s/g, ''));
        setField('phone', state.phone);
        $('phoneHint').classList.toggle('show', !state.phone && v.length > 3);
        updateSubmit();
    });
</script>
</body>
</html>
