<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Cart — NaijaMart</title>
    <th:block th:replace="~{fragments/head :: resources}"/>
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden">

<th:block th:replace="~{fragments/mobile-nav :: mobileHeader('My Cart', false, null)}"/>

<main class="pt-14 pb-20 min-h-screen">

    <!-- Flash -->
    <div th:if="${cartSuccess}"
         class="mx-4 mt-3 bg-green-50 border border-green-200 rounded-xl px-4 py-2.5 text-green-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-base">check_circle</span>
        <span th:text="${cartSuccess}">Success</span>
    </div>
    <div th:if="${cartError}"
         class="mx-4 mt-3 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-red-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <span th:text="${cartError}">Error</span>
    </div>

    <!-- Empty state -->
    <div th:if="${cart.empty}" class="flex flex-col items-center justify-center px-8 py-20 text-center">
        <span class="material-symbols-outlined text-7xl text-outline-variant mb-4">shopping_cart</span>
        <h3 class="font-bold text-on-surface text-lg mb-2">Your cart is empty</h3>
        <p class="text-sm text-on-surface-variant mb-6">Add items from the shop to get started</p>
        <a th:href="@{/mobile/shop}"
           class="flex items-center gap-2 bg-primary text-on-primary font-bold px-6 py-3 rounded-xl active:opacity-80">
            <span class="material-symbols-outlined">storefront</span>
            Browse Products
        </a>
    </div>

    <!-- Cart Items -->
    <div th:unless="${cart.empty}" class="px-4 pt-4 space-y-3">
        <div th:each="item : ${cart.items}"
             class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-3 flex gap-3">
            <!-- Image -->
            <a th:href="@{/mobile/shop/{slug}(slug=${item.slug})}"
               class="w-20 h-20 rounded-xl overflow-hidden bg-surface-container-low flex-shrink-0">
                <img th:if="${item.primaryImageUrl != null}"
                     th:src="${item.primaryImageUrl}"
                     th:alt="${item.productName}"
                     class="w-full h-full object-cover"/>
                <div th:if="${item.primaryImageUrl == null}"
                     class="w-full h-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-2xl text-outline-variant">image</span>
                </div>
            </a>
            <!-- Details -->
            <div class="flex-1 min-w-0">
                <a th:href="@{/mobile/shop/{slug}(slug=${item.slug})}">
                    <p class="text-sm font-semibold text-on-surface line-clamp-2" th:text="${item.productName}">Product</p>
                </a>
                <p class="text-xs text-on-surface-variant mt-0.5" th:if="${item.vendorName != null}" th:text="${item.vendorName}">Vendor</p>
                <p class="text-sm font-bold text-primary mt-1">
                    ₦<span th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                </p>
                <!-- Quantity controls + Remove -->
                <div class="flex items-center gap-2 mt-2">
                    <form th:action="@{/mobile/cart/items/{id}/quantity(id=${item.productId})}" method="post"
                          class="flex items-center border border-outline-variant rounded-lg overflow-hidden">
                        <button type="submit" name="quantity" th:value="${item.quantity - 1}"
                                class="w-8 h-8 flex items-center justify-center text-on-surface-variant active:bg-surface-container text-lg font-bold">−</button>
                        <span class="w-8 text-center text-sm font-bold text-on-surface" th:text="${item.quantity}">1</span>
                        <button type="submit" name="quantity" th:value="${item.quantity + 1}"
                                class="w-8 h-8 flex items-center justify-center text-on-surface-variant active:bg-surface-container text-lg font-bold">+</button>
                    </form>
                    <form th:action="@{/mobile/cart/items/{id}/remove(id=${item.productId})}" method="post">
                        <button type="submit"
                                class="w-8 h-8 flex items-center justify-center text-error active:bg-error/10 rounded-lg">
                            <span class="material-symbols-outlined text-base">delete</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-4 mt-4">
            <h3 class="font-bold text-on-surface mb-3">Order Summary</h3>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-on-surface-variant">
                    <span>Subtotal</span>
                    <span>₦<span th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'COMMA', 2, 'POINT')}">0.00</span></span>
                </div>
                <div class="flex justify-between text-on-surface-variant">
                    <span>Delivery fee</span>
                    <span>₦1,500.00</span>
                </div>
                <div class="flex justify-between font-bold text-on-surface text-base pt-2 border-t border-outline-variant/30">
                    <span>Total</span>
                    <span class="text-primary">₦<span th:text="${#numbers.formatDecimal(cart.subtotal + 1500, 0, 'COMMA', 2, 'POINT')}">0.00</span></span>
                </div>
            </div>
        </div>

        <!-- Checkout CTA -->
        <a th:href="@{/mobile/checkout}"
           class="flex items-center justify-center gap-2 w-full bg-primary text-on-primary font-bold py-4 rounded-2xl shadow-md shadow-primary/20 active:opacity-80 transition-opacity mt-2">
            <span class="material-symbols-outlined">lock</span>
            Proceed to Checkout
        </a>
    </div>

</main>

<th:block th:replace="~{fragments/mobile-nav :: mobileBottomNav('cart')}"/>

<style>
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</body>
</html>
