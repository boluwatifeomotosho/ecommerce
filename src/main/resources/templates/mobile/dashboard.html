<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Account — NaijaMart</title>
    <th:block th:replace="~{fragments/head :: resources}"/>
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden">

<th:block th:replace="~{fragments/mobile-nav :: mobileHeader('Account', false, null)}"/>

<main class="pt-14 pb-20 min-h-screen">

    <!-- Profile Card -->
    <div class="mx-4 mt-4 bg-gradient-to-br from-primary to-primary/80 text-on-primary rounded-2xl p-5">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-on-primary/20 flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1">person</span>
            </div>
            <div>
                <p class="font-bold text-lg" th:text="${name}">Customer</p>
                <span class="text-xs bg-on-primary/20 px-2.5 py-0.5 rounded-full font-semibold uppercase tracking-wider">Member</span>
            </div>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 gap-3 mx-4 mt-4">
        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-primary" th:text="${activeOrderCount ?: 0}">0</p>
            <p class="text-xs text-on-surface-variant mt-1">Total Orders</p>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-secondary" th:text="${wishlistCount ?: 0}">0</p>
            <p class="text-xs text-on-surface-variant mt-1">Wishlist Items</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="mx-4 mt-4 bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm overflow-hidden">
        <a th:href="@{/mobile/orders}"
           class="flex items-center gap-4 px-4 py-4 border-b border-outline-variant/20 active:bg-surface-container transition-colors">
            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-primary text-xl">package</span>
            </div>
            <div class="flex-1">
                <p class="text-sm font-semibold text-on-surface">My Orders</p>
                <p class="text-xs text-on-surface-variant">Track and manage your orders</p>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </a>
        <a th:href="@{/mobile/wishlist}"
           class="flex items-center gap-4 px-4 py-4 border-b border-outline-variant/20 active:bg-surface-container transition-colors">
            <div class="w-10 h-10 rounded-xl bg-error/10 flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-error text-xl" style="font-variation-settings:'FILL' 1">favorite</span>
            </div>
            <div class="flex-1">
                <p class="text-sm font-semibold text-on-surface">Wishlist</p>
                <p class="text-xs text-on-surface-variant">Items you saved for later</p>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </a>
        <a th:href="@{/mobile/settings}"
           class="flex items-center gap-4 px-4 py-4 active:bg-surface-container transition-colors">
            <div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-on-surface-variant text-xl">settings</span>
            </div>
            <div class="flex-1">
                <p class="text-sm font-semibold text-on-surface">Settings</p>
                <p class="text-xs text-on-surface-variant">Profile, addresses &amp; more</p>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </a>
    </div>

    <!-- Recent Orders -->
    <div th:if="${recentOrders != null and !recentOrders.isEmpty()}"
         class="mx-4 mt-4">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-on-surface text-sm">Recent Orders</h3>
            <a th:href="@{/mobile/orders}" class="text-xs text-primary font-semibold">See all</a>
        </div>
        <div class="space-y-2">
            <a th:each="order : ${recentOrders}"
               th:href="@{/mobile/orders/{id}(id=${order.id})}"
               class="flex items-center gap-3 bg-surface-container-lowest rounded-xl border border-outline-variant/20 px-4 py-3 active:bg-surface-container transition-colors">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
                     th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-green-100' :
                                    (${order.status.name() == 'SHIPPED'} ? 'bg-blue-100' :
                                    (${order.status.name() == 'PAID' or order.status.name() == 'PROCESSING'} ? 'bg-amber-100' :
                                    (${order.status.name() == 'CANCELLED'} ? 'bg-red-100' : 'bg-surface-container')))">
                    <span class="material-symbols-outlined text-lg"
                          th:classappend="${order.status.name() == 'DELIVERED'} ? 'text-green-600' :
                                         (${order.status.name() == 'SHIPPED'} ? 'text-blue-600' :
                                         (${order.status.name() == 'PAID' or order.status.name() == 'PROCESSING'} ? 'text-amber-600' :
                                         (${order.status.name() == 'CANCELLED'} ? 'text-red-600' : 'text-on-surface-variant')))">package</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-on-surface truncate"
                       th:text="${order.status.name().replace('_', ' ')}">Status</p>
                    <p class="text-xs text-on-surface-variant"
                       th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">Date</p>
                </div>
                <span class="text-sm font-bold text-primary flex-shrink-0">
                    ₦<span th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')}">0</span>
                </span>
            </a>
        </div>
    </div>

    <!-- Logout -->
    <div class="mx-4 mt-4 mb-2">
        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="w-full flex items-center justify-center gap-2 border border-error/30 text-error font-semibold py-3.5 rounded-2xl active:bg-error/5 transition-colors">
                <span class="material-symbols-outlined">logout</span>
                Logout
            </button>
        </form>
    </div>

</main>

<th:block th:replace="~{fragments/mobile-nav :: mobileBottomNav('account')}"/>
</body>
</html>
