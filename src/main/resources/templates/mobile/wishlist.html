<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Wishlist — Pinepetosan Marketplace</title>
    <th:block th:replace="~{fragments/head :: resources}"/>
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden page-enter">

<th:block th:replace="~{fragments/mobile-nav :: mobileHeader('Wishlist', false, null)}"/>

<main class="pt-14 pb-20 min-h-screen">

    <!-- Flash -->
    <div th:if="${wishlistMessage}"
         class="mx-4 mt-3 bg-green-50 border border-green-200 rounded-xl px-4 py-2.5 text-green-700 text-sm flex items-center gap-2 anim-fade-down">
        <span class="material-symbols-outlined text-base">check_circle</span>
        <span th:text="${wishlistMessage}">Message</span>
    </div>

    <!-- Empty state -->
    <div th:if="${wishlistItems == null or wishlistItems.isEmpty()}"
         class="flex flex-col items-center justify-center px-8 py-20 text-center anim-scale anim-d1">
        <span class="material-symbols-outlined text-7xl text-outline-variant mb-4">favorite</span>
        <h3 class="font-bold text-on-surface text-lg mb-2">Your wishlist is empty</h3>
        <p class="text-sm text-on-surface-variant mb-6">Save items you love to buy later</p>
        <a th:href="@{/mobile/shop}"
           class="flex items-center gap-2 bg-primary text-on-primary font-bold px-6 py-3 rounded-xl">
            <span class="material-symbols-outlined">storefront</span>
            Browse Products
        </a>
    </div>

    <!-- Wishlist Grid -->
    <div th:unless="${wishlistItems == null or wishlistItems.isEmpty()}"
         class="px-4 pt-4 grid grid-cols-2 gap-3 anim-list">
        <div th:each="item : ${wishlistItems}"
             class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm overflow-hidden">
            <!-- Image -->
            <a th:href="@{/mobile/shop/{slug}(slug=${item.product.slug})}"
               class="block aspect-square bg-surface-container-low overflow-hidden relative">
                <img th:if="${item.product.primaryImageUrl != null}"
                     th:src="${item.product.primaryImageUrl}"
                     th:alt="${item.product.name}"
                     class="w-full h-full object-cover"/>
                <div th:if="${item.product.primaryImageUrl == null}"
                     class="w-full h-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-4xl text-outline-variant">image</span>
                </div>
                <!-- Remove from wishlist -->
                <form th:action="@{/mobile/wishlist/toggle}" method="post"
                      class="absolute top-2 right-2">
                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                    <input type="hidden" name="returnUrl" value="/mobile/wishlist"/>
                    <button type="submit"
                            class="w-8 h-8 rounded-full bg-white/90 shadow flex items-center justify-center active:scale-90">
                        <span class="material-symbols-outlined text-error text-base" style="font-variation-settings:'FILL' 1">favorite</span>
                    </button>
                </form>
            </a>
            <!-- Info -->
            <div class="p-3">
                <a th:href="@{/mobile/shop/{slug}(slug=${item.product.slug})}">
                    <p class="text-xs font-semibold text-on-surface line-clamp-2 mb-1" th:text="${item.product.name}">Product</p>
                </a>
                <p class="text-sm font-bold text-primary mb-2">
                    ₦<span th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')}">0</span>
                </p>
                <form th:if="${item.product.stockQuantity > 0}"
                      th:action="@{/mobile/cart/items}" method="post">
                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                    <input type="hidden" name="quantity" value="1"/>
                    <input type="hidden" name="returnUrl" value="/mobile/wishlist"/>
                    <button type="submit"
                            class="w-full text-xs font-bold bg-primary text-on-primary py-2 rounded-xl active:opacity-80">
                        Add to Cart
                    </button>
                </form>
                <span th:if="${item.product.stockQuantity == 0}"
                      class="block w-full text-xs font-semibold text-on-surface-variant text-center py-2 bg-surface-container rounded-xl">
                    Out of Stock
                </span>
            </div>
        </div>
    </div>

</main>

<th:block th:replace="~{fragments/mobile-nav :: mobileBottomNav('wishlist')}"/>

<style>
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</body>
</html>
