<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>My Orders — NaijaMart</title>
    <th:block th:replace="~{fragments/head :: resources}"/>
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden">

<th:block th:replace="~{fragments/mobile-nav :: mobileHeader('My Orders', false, null)}"/>

<main class="pt-14 pb-20 min-h-screen">

    <!-- Status filter tabs -->
    <div class="flex gap-2 overflow-x-auto px-4 pt-4 pb-3 scrollbar-hide border-b border-outline-variant/20">
        <a th:href="@{/mobile/orders}"
           th:classappend="${activeStatus == null} ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant border border-outline-variant/30'"
           class="flex-shrink-0 text-xs font-bold px-4 py-2 rounded-full">All</a>
        <a th:each="s : ${ {'PENDING_PAYMENT','PAID','PROCESSING','SHIPPED','DELIVERED','CANCELLED'} }"
           th:href="@{/mobile/orders(status=${s})}"
           th:text="${s.replace('_', ' ')}"
           th:classappend="${activeStatus == s} ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant border border-outline-variant/30'"
           class="flex-shrink-0 text-xs font-bold px-4 py-2 rounded-full capitalize">Status</a>
    </div>

    <!-- Flash -->
    <div th:if="${successMessage}"
         class="mx-4 mt-3 bg-green-50 border border-green-200 rounded-xl px-4 py-2.5 text-green-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-base">check_circle</span>
        <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${paymentError}"
         class="mx-4 mt-3 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 text-red-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <span th:text="${paymentError}">Error</span>
    </div>

    <!-- Empty state -->
    <div th:if="${orders.isEmpty()}" class="flex flex-col items-center justify-center px-8 py-16 text-center">
        <span class="material-symbols-outlined text-7xl text-outline-variant mb-4">package</span>
        <h3 class="font-bold text-on-surface text-lg mb-2">No orders yet</h3>
        <p class="text-sm text-on-surface-variant mb-6">Start shopping to place your first order</p>
        <a th:href="@{/mobile/shop}"
           class="flex items-center gap-2 bg-primary text-on-primary font-bold px-6 py-3 rounded-xl">
            <span class="material-symbols-outlined">storefront</span>
            Browse Products
        </a>
    </div>

    <!-- Orders List -->
    <div class="px-4 pt-3 space-y-3">
        <a th:each="order : ${orders.content}"
           th:href="@{/mobile/orders/{id}(id=${order.id})}"
           class="block bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-4 active:bg-surface-container transition-colors">

            <!-- Status + Date row -->
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold px-2.5 py-1 rounded-full"
                      th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-green-100 text-green-700' :
                                      (${order.status.name() == 'SHIPPED'} ? 'bg-blue-100 text-blue-700' :
                                      (${order.status.name() == 'PAID' or order.status.name() == 'PROCESSING'} ? 'bg-amber-100 text-amber-700' :
                                      (${order.status.name() == 'CANCELLED'} ? 'bg-red-100 text-red-700' :
                                      'bg-surface-container text-on-surface-variant')))"
                      th:text="${order.status.name().replace('_', ' ')}">Status</span>
                <span class="text-xs text-on-surface-variant"
                      th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">Date</span>
            </div>

            <!-- Order ID -->
            <p class="text-xs text-on-surface-variant mb-2">
                Order #<span th:text="${#strings.abbreviate(order.id.toString(), 8)}">id</span>
            </p>

            <!-- Items preview -->
            <p class="text-sm font-semibold text-on-surface mb-1">
                <span th:text="${order.items.size()}">0</span> item<span th:if="${order.items.size() != 1}">s</span>
                <span th:if="${order.items.size() > 0}" th:text="' · ' + ${order.items[0].productName}"></span>
                <span th:if="${order.items.size() > 1}" th:text="' +' + (${order.items.size() - 1}) + ' more'"></span>
            </p>

            <!-- Total + arrow -->
            <div class="flex items-center justify-between">
                <span class="text-base font-bold text-primary">
                    ₦<span th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                </span>
                <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
            </div>
        </a>
    </div>

    <!-- Pagination -->
    <div th:if="${orders.totalPages > 1}" class="flex justify-center gap-3 px-4 mt-5">
        <a th:if="${orders.hasPreviousPage()}"
           th:href="@{/mobile/orders(page=${orders.number - 1}, status=${activeStatus})}"
           class="px-4 py-2 bg-surface-container text-on-surface text-sm font-semibold rounded-xl border border-outline-variant/30">
            Prev
        </a>
        <span class="px-4 py-2 text-sm text-on-surface-variant">
            <span th:text="${orders.number + 1}">1</span> / <span th:text="${orders.totalPages}">1</span>
        </span>
        <a th:if="${orders.hasNextPage()}"
           th:href="@{/mobile/orders(page=${orders.number + 1}, status=${activeStatus})}"
           class="px-4 py-2 bg-primary text-on-primary text-sm font-semibold rounded-xl">
            Next
        </a>
    </div>

</main>

<th:block th:replace="~{fragments/mobile-nav :: mobileBottomNav('orders')}"/>

<style>
.scrollbar-hide::-webkit-scrollbar { display: none; }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</body>
</html>
