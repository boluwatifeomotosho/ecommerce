<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Created — Pinepetosan Marketplace</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a00 0%, #3d1f08 40%, #6b3a1f 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: #ff8c00; top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #c0392b; bottom: -80px; right: -60px; animation-delay: -3s; }
        .orb-3 { width: 200px; height: 200px; background: #e67e22; top: 50%; left: 50%; animation-delay: -6s; }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-30px) scale(1.07); }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo { margin-bottom: 32px; }
        .logo span { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .logo span em { color: #ff8c00; font-style: normal; }

        .success-icon {
            width: 72px; height: 72px;
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid rgba(34, 197, 94, 0.5);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            animation: popIn 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }

        h2 { color: #fff; font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        p.sub {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: block;
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #ff8c00, #e65c00);
            color: #fff; font-size: 1rem; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .links { margin-top: 18px; }
        .links a { color: #ff8c00; text-decoration: none; font-size: 0.875rem; }
        .links a:hover { text-decoration: underline; }
        .links span { color: rgba(255,255,255,0.45); font-size: 0.875rem; }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
    <div class="logo"><span>Naija<em>Mart</em></span></div>

    <div class="success-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    </div>

    <h2>Account Created!</h2>
    <p class="sub">
        Your phone number has been verified and your account is ready.<br/>
        Log in to start shopping on Pinepetosan Marketplace.
    </p>

    <a th:href="@{/login}" class="btn">Log In Now</a>

    <div class="links" style="margin-top: 20px;">
        <span>Want to browse first?</span>
        <a th:href="@{/}" style="margin-left: 6px;">Go to Home</a>
    </div>
</div>
</body>
</html>
