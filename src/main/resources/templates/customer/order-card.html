<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="orderCard">
<div th:id="'order-card-' + ${order.id}"
     class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm overflow-hidden">

    <!-- Order header -->
    <div class="px-lg py-md flex flex-wrap justify-between items-center gap-3 border-b border-outline-variant/20">
        <div>
            <p class="text-xs text-on-surface-variant uppercase tracking-wider font-bold">Order</p>
            <p class="font-mono text-sm font-bold text-on-surface mt-0.5"
               th:text="${#strings.substring(order.id.toString(), 0, 8).toUpperCase()}">ABCD1234</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-on-surface-variant">Date</p>
            <p class="text-sm font-medium text-on-surface mt-0.5"
               th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">01 Jan 2025</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-on-surface-variant">Total</p>
            <p class="text-sm font-bold text-primary mt-0.5">
                ₦<span th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}">0.00</span>
            </p>
        </div>
        <div>
            <span th:switch="${order.status.name()}">
                <span th:case="'PENDING_PAYMENT'" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-bold">Pending Payment</span>
                <span th:case="'PAID'"            class="bg-blue-100  text-blue-700  px-3 py-1 rounded-full text-xs font-bold">Paid</span>
                <span th:case="'PROCESSING'"      class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold">Processing</span>
                <span th:case="'SHIPPED'"         class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">Shipped</span>
                <span th:case="'DELIVERED'"       class="bg-green-100  text-green-700  px-3 py-1 rounded-full text-xs font-bold">Delivered</span>
                <span th:case="'CANCELLED'"       class="bg-red-100    text-red-700    px-3 py-1 rounded-full text-xs font-bold">Cancelled</span>
                <span th:case="*"                 class="bg-surface-container text-on-surface-variant px-3 py-1 rounded-full text-xs font-bold" th:text="${order.status}">Status</span>
            </span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Cancel button — only for PENDING_PAYMENT; HTMX submits form, JS opens modal -->
            <form th:if="${order.status.name() == 'PENDING_PAYMENT'}"
                  th:action="@{/customer/orders/{id}/cancel(id=${order.id})}"
                  th:hx-post="@{/customer/orders/{id}/cancel(id=${order.id})}"
                  th:hx-target="|#order-card-${order.id}|"
                  hx-swap="outerHTML"
                  method="post">
                <button type="button"
                        th:attr="data-order-ref=${#strings.substring(order.id.toString(),0,8).toUpperCase()}"
                        onclick="openCancelModal(this)"
                        class="text-red-600 font-semibold text-sm hover:underline flex items-center gap-1 transition-colors">
                    <span class="material-symbols-outlined text-sm">cancel</span> Cancel
                </button>
            </form>
            <a th:href="@{/customer/orders/{id}(id=${order.id})}"
               class="text-primary font-semibold text-sm hover:underline flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">visibility</span> View
            </a>
        </div>
    </div>

    <!-- Items preview (first 2) -->
    <div class="px-lg py-3 flex flex-wrap gap-2">
        <span th:each="item, stat : ${order.items}" th:if="${stat.index < 2}"
              class="text-xs bg-surface-container px-2 py-1 rounded-full text-on-surface-variant">
            <span th:text="${item.quantity}">1</span>× <span th:text="${item.productName}">Product</span>
        </span>
        <span th:if="${order.items.size() > 2}"
              class="text-xs bg-surface-container px-2 py-1 rounded-full text-on-surface-variant">
            +<span th:text="${order.items.size() - 2}">0</span> more
        </span>
    </div>
</div>
</th:block>
</html>
