<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activePage, userName, userEmail)">

<style>
  #sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #sidebar.sidebar-open { transform: translateX(0); }
  @media (min-width: 768px) {
    #sidebar { transform: translateX(0) !important; }
    #mobile-topbar { display: none !important; }
    #sidebar-overlay { display: none !important; }
  }
</style>

<!-- Mobile top bar -->
<div id="mobile-topbar" class="fixed top-0 left-0 right-0 h-16 bg-surface-container-lowest border-b border-outline-variant z-30 flex items-center px-4 gap-3 shadow-sm">
    <button onclick="openSidebar()"
            class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-on-surface">menu</span>
    </button>
    <div class="flex-1">
        <h1 class="font-bold text-primary text-lg leading-tight">Pinepetosan Marketplace</h1>
        <p class="text-[10px] text-on-surface-variant uppercase tracking-wider leading-tight">Admin Panel</p>
    </div>
</div>

<!-- Overlay -->
<div id="sidebar-overlay" onclick="closeSidebar()"
     class="fixed inset-0 bg-black/50 z-40 hidden"></div>

<!-- Sidebar -->
<aside id="sidebar"
       class="fixed left-0 top-0 h-full w-[280px] bg-surface-container-lowest border-r border-outline-variant flex flex-col z-50 shadow-xl shadow-primary/5">
    <div class="px-md py-lg flex items-center justify-between">
        <div>
            <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Pinepetosan Marketplace</h1>
            <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Admin Panel</p>
        </div>
        <button onclick="closeSidebar()"
                class="md:hidden w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-on-surface-variant text-xl">close</span>
        </button>
    </div>
    <div class="mx-md mb-lg">
        <div class="flex items-center gap-sm p-sm rounded-xl bg-surface-container-low border border-outline-variant/30">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-white font-bold shadow-md shadow-primary/20">A</div>
            <div>
                <p class="font-label-md text-label-md font-bold text-on-surface" th:text="${userName}">Admin</p>
                <p class="text-[11px] text-on-surface-variant" th:text="${userEmail}">admin@naija.mart</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-xs space-y-0.5">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md">Dashboard</span>
        </a>
        <a th:href="@{/admin/users}"
           th:classappend="${activePage == 'users'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">people</span>
            <span class="font-label-md">Customers</span>
        </a>
        <a th:href="@{/admin/vendors}"
           th:classappend="${activePage == 'vendors'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">storefront</span>
            <span class="font-label-md">Vendors</span>
        </a>
        <a th:href="@{/admin/products/catalog}"
           th:classappend="${activePage == 'catalog'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">inventory_2</span>
            <span class="font-label-md">Product Catalog</span>
        </a>
        <a th:href="@{/admin/orders}"
           th:classappend="${activePage == 'orders'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">shopping_bag</span>
            <span class="font-label-md">Orders</span>
        </a>
        <a th:href="@{/admin/reports}"
           th:classappend="${activePage == 'reports'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">analytics</span>
            <span class="font-label-md">Reports</span>
        </a>
        <a th:href="@{/admin/settings}"
           th:classappend="${activePage == 'settings'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-md">Settings</span>
        </a>
    </nav>
    <div class="p-md border-t border-outline-variant/30">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="w-full flex items-center gap-3 px-4 py-2.5 text-error hover:bg-error/5 rounded-lg transition-all font-label-md">
                <span class="material-symbols-outlined">logout</span>
                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>

<script>
function openSidebar() {
    document.getElementById('sidebar').classList.add('sidebar-open');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('sidebar-open');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    document.body.style.overflow = '';
}
</script>

</th:block>
</html>
