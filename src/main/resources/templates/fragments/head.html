<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="resources">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc3d8; border-radius: 10px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        @keyframes slideInLeft { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:translateX(0); } }
        @keyframes fadeInDown  { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeInUp    { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn      { from { opacity:0; }                              to { opacity:1; } }
        @keyframes scaleIn     { from { opacity:0; transform:scale(.95); }        to { opacity:1; transform:scale(1); } }

        .anim-slide-left  { animation: slideInLeft .5s cubic-bezier(.22,1,.36,1) both; }
        .anim-fade-down   { animation: fadeInDown  .45s cubic-bezier(.22,1,.36,1) both; }
        .anim-fade-up     { animation: fadeInUp    .45s cubic-bezier(.22,1,.36,1) both; }
        .anim-fade        { animation: fadeIn      .4s ease both; }
        .anim-scale       { animation: scaleIn     .4s cubic-bezier(.34,1.56,.64,1) both; }
        .anim-d1 { animation-delay: .1s; }
        .anim-d2 { animation-delay: .2s; }
        .anim-d3 { animation-delay: .3s; }
        .anim-d4 { animation-delay: .4s; }
        .anim-d5 { animation-delay: .5s; }
        .anim-d6 { animation-delay: .6s; }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright":"#f9f9ff","tertiary-fixed":"#6ffbbe","on-secondary-fixed":"#2a1700",
                        "surface-variant":"#d8e3fb","on-tertiary-fixed":"#002113","secondary":"#855300",
                        "on-secondary-fixed-variant":"#653e00","on-secondary-container":"#684000","primary":"#630ed4",
                        "error":"#ba1a1a","on-secondary":"#ffffff","primary-fixed-dim":"#d2bbff",
                        "tertiary-container":"#007650","on-surface":"#111c2d","background":"#f9f9ff",
                        "inverse-surface":"#263143","surface-dim":"#cfdaf2","inverse-primary":"#d2bbff",
                        "secondary-fixed-dim":"#ffb95f","on-error":"#ffffff","on-tertiary-fixed-variant":"#005236",
                        "on-primary-fixed":"#25005a","surface":"#f9f9ff","on-tertiary":"#ffffff","on-primary":"#ffffff",
                        "secondary-fixed":"#ffddb8","outline":"#7b7487","on-background":"#111c2d",
                        "surface-container-low":"#f0f3ff","tertiary-fixed-dim":"#4edea3","outline-variant":"#ccc3d8",
                        "surface-container":"#e7eeff","error-container":"#ffdad6","on-surface-variant":"#4a4455",
                        "surface-container-high":"#dee8ff","tertiary":"#005b3d","on-primary-fixed-variant":"#5a00c6",
                        "secondary-container":"#fea619","surface-tint":"#732ee4","surface-container-lowest":"#ffffff",
                        "primary-container":"#7c3aed","on-error-container":"#93000a","on-primary-container":"#ede0ff",
                        "surface-container-highest":"#d8e3fb","on-tertiary-container":"#76ffc2",
                        "inverse-on-surface":"#ecf1ff","primary-fixed":"#eaddff"
                    },
                    borderRadius: { DEFAULT:"0.25rem", lg:"0.5rem", xl:"0.75rem", full:"9999px" },
                    spacing: { base:"4px", xs:"0.5rem", md:"1.5rem", xl:"3rem", sm:"1rem", gutter:"24px", "container-max":"1280px", lg:"2rem" },
                    fontFamily: { sans:["Plus Jakarta Sans","sans-serif"] },
                    fontSize: {
                        "display-lg":["48px",{lineHeight:"60px",letterSpacing:"-0.02em",fontWeight:"700"}],
                        "body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],
                        "label-md":["14px",{lineHeight:"20px",fontWeight:"500"}],
                        "label-sm":["12px",{lineHeight:"16px",fontWeight:"600"}],
                        "headline-lg":["30px",{lineHeight:"38px",fontWeight:"700"}],
                        "headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],
                        "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}]
                    }
                }
            }
        }
    </script>
</th:block>
</html>
