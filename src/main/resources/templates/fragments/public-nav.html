<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="nav" class="bg-surface-bright sticky top-0 z-50 shadow-[0px_4px_20px_rgba(30,41,59,0.05)] border-b border-outline-variant/30 transition-all duration-300" id="public-navbar">
    <div class="max-w-container-max mx-auto px-gutter flex justify-between items-center h-16">
        <div class="flex items-center gap-xl">
            <a th:href="@{/}" class="font-headline-md text-headline-md font-bold text-primary tracking-tight">NaijaMart</a>
            <div class="hidden md:flex items-center gap-lg">
                <a th:href="@{/}" class="text-body-md text-on-surface-variant hover:text-primary transition-colors">Home</a>
                <a th:href="@{/products}" class="text-body-md text-on-surface-variant hover:text-primary transition-colors">Shop</a>
            </div>
        </div>
        <div class="flex items-center gap-xs sm:gap-sm">
            <!-- Authenticated user -->
            <th:block sec:authorize="isAuthenticated()">
                <!-- Cart icon — customers only -->
                <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/cart}"
                   class="relative flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors"
                   title="Cart">
                    <span class="material-symbols-outlined text-on-surface-variant">shopping_cart</span>
                    <span th:if="${cartItemCount != null and cartItemCount > 0}"
                          class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-primary text-on-primary text-[10px] font-bold rounded-full flex items-center justify-center px-1"
                          th:text="${cartItemCount > 9 ? '9+' : cartItemCount}">0</span>
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}"
                   class="hidden md:inline-flex items-center gap-1 px-md py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5 transition-all">
                    <span class="material-symbols-outlined text-sm">dashboard</span> Dashboard
                </a>
                <a sec:authorize="hasRole('VENDOR')" th:href="@{/vendor/dashboard}"
                   class="hidden md:inline-flex items-center gap-1 px-md py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5 transition-all">
                    <span class="material-symbols-outlined text-sm">dashboard</span> Dashboard
                </a>
                <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/dashboard}"
                   class="hidden md:inline-flex items-center gap-1 px-md py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5 transition-all">
                    <span class="material-symbols-outlined text-sm">dashboard</span> Dashboard
                </a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="px-md py-2 text-label-md bg-primary text-on-primary rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 transition-all active:scale-95">Logout</button>
                </form>
            </th:block>
            <!-- Anonymous user -->
             <th:block sec:authorize="isAnonymous()">
                 <a th:href="@{/register/vendor}" class="hidden md:block text-body-md text-on-surface-variant hover:text-primary transition-colors">Register as Vendor</a>
                 <a th:href="@{/login}" class="hidden sm:block px-md py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5 transition-all">Login</a>
                 <a th:href="@{/register}" class="hidden sm:block px-md py-2 text-label-md bg-primary text-on-primary rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 transition-all active:scale-95">Sign Up</a>
                 <a th:href="@{/login}" class="sm:hidden shrink-0 px-2.5 py-1.5 text-xs text-primary border border-primary rounded-md hover:bg-primary/5 transition-all">Sign In</a>
                 <a th:href="@{/register}" class="sm:hidden shrink-0 px-2.5 py-1.5 text-xs bg-primary text-on-primary rounded-md hover:opacity-90 transition-all active:scale-95">Sign Up</a>
             </th:block>
        </div>
    </div>
</nav>
</html>
