<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activePage, userName, userEmail)">

<style>
  #sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #sidebar.sidebar-open { transform: translateX(0); }
  @media (min-width: 768px) {
    #sidebar { transform: translateX(0) !important; }
    #mobile-topbar { display: none !important; }
    #sidebar-overlay { display: none !important; }
  }
</style>

<div id="mobile-topbar" class="fixed top-0 left-0 right-0 h-16 bg-surface-container-lowest border-b border-outline-variant z-30 flex items-center px-4 gap-3 shadow-sm">
    <button onclick="openSidebar()"
            class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-on-surface">menu</span>
    </button>
    <div class="flex-1">
        <h1 class="font-bold text-primary text-lg leading-tight">Pinepetosan Marketplace</h1>
        <p class="text-[10px] text-on-surface-variant uppercase tracking-wider leading-tight">Warehouse Agent</p>
    </div>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"
     class="fixed inset-0 bg-black/50 z-40 hidden"></div>

<aside id="sidebar"
       class="fixed left-0 top-0 h-full w-[280px] bg-surface-container-lowest border-r border-outline-variant flex flex-col z-50 shadow-xl shadow-primary/5">
    <div class="px-md py-lg flex items-center justify-between">
        <div class="flex items-center gap-xs">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">local_shipping</span>
            </div>
            <div>
                <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Pinepetosan</h1>
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Agent Portal</p>
            </div>
        </div>
        <button onclick="closeSidebar()"
                class="md:hidden w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-on-surface-variant text-xl">close</span>
        </button>
    </div>
    <div class="mx-md mb-lg">
        <div class="flex items-center gap-sm p-sm rounded-xl bg-surface-container-low border border-outline-variant/30">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-white font-bold shadow-md shadow-primary/20">
                <span class="material-symbols-outlined text-lg">local_shipping</span>
            </div>
            <div class="overflow-hidden min-w-0">
                <p class="font-label-md text-label-md font-bold text-on-surface truncate" th:text="${userName}">Agent</p>
                <p class="text-[11px] text-on-surface-variant truncate" th:text="${userEmail}">agent@company.com</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-xs space-y-0.5">
        <a th:href="@{/agent/deliveries}"
           th:classappend="${activePage == 'deliveries'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">local_shipping</span>
            <span class="font-label-md">My Deliveries</span>
        </a>
        <a th:href="@{/notifications}"
           th:classappend="${activePage == 'notifications'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg mx-2 transition-all">
            <span class="material-symbols-outlined">notifications</span>
            <span class="font-label-md flex-1">Notifications</span>
            <span th:if="${notificationUnreadCount != null and notificationUnreadCount > 0}"
                  class="min-w-[20px] h-5 bg-error text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1"
                  th:text="${notificationUnreadCount > 9 ? '9+' : notificationUnreadCount}">0</span>
        </a>
    </nav>
    <div class="p-md border-t border-outline-variant/30">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="w-full flex items-center gap-3 px-4 py-2.5 text-error hover:bg-error/5 rounded-lg transition-all font-label-md">
                <span class="material-symbols-outlined">logout</span>
                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>

<script>
function openSidebar() {
    document.getElementById('sidebar').classList.add('sidebar-open');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('sidebar-open');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    document.body.style.overflow = '';
}
</script>

</th:block>
</html>
