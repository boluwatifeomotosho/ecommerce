<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activePage, userName)">

<style>
  #sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #sidebar.sidebar-open { transform: translateX(0); }
  @media (min-width: 768px) {
    #sidebar { transform: translateX(0) !important; }
    #mobile-topbar { display: none !important; }
    #sidebar-overlay { display: none !important; }
  }
</style>

<!-- Mobile top bar -->
<div id="mobile-topbar" class="fixed top-0 left-0 right-0 h-16 bg-surface-container-highest border-b border-outline-variant z-30 flex items-center px-4 gap-3 shadow-sm">
    <button onclick="openSidebar()"
            class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-on-surface">menu</span>
    </button>
    <h1 class="font-bold text-primary text-lg flex-1">NaijaMart</h1>
    <span class="text-xs text-on-surface-variant font-semibold uppercase tracking-wider">Vendor</span>
</div>

<!-- Overlay -->
<div id="sidebar-overlay" onclick="closeSidebar()"
     class="fixed inset-0 bg-black/50 z-40 hidden"></div>

<!-- Sidebar -->
<aside id="sidebar"
       class="fixed left-0 top-0 h-full w-[280px] bg-surface-container-highest border-r border-outline-variant flex flex-col z-50 shadow-xl shadow-primary/5">
    <div class="px-md py-lg flex items-center justify-between gap-xs">
        <div class="flex items-center gap-xs">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">storefront</span>
            </div>
            <div>
                <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">NaijaMart</h1>
                <p class="font-label-sm text-label-sm text-on-surface-variant">Vendor Portal</p>
            </div>
        </div>
        <button onclick="closeSidebar()"
                class="md:hidden w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors flex-shrink-0">
            <span class="material-symbols-outlined text-on-surface-variant text-xl">close</span>
        </button>
    </div>
    <div class="mx-md mb-md p-sm bg-white/60 rounded-xl flex items-center gap-sm border border-white shadow-sm">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-white flex-shrink-0 shadow-md shadow-primary/20">
            <span class="material-symbols-outlined">storefront</span>
        </div>
        <div class="overflow-hidden">
            <p class="font-label-md text-label-md font-bold truncate" th:text="${userName}">Vendor</p>
            <div class="flex items-center gap-1">
                <span class="material-symbols-outlined text-[12px] text-tertiary" style="font-variation-settings:'FILL' 1;">verified</span>
                <span class="text-[10px] uppercase tracking-wider font-bold text-tertiary">Verified</span>
            </div>
        </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-xs flex flex-col gap-0.5">
        <a th:href="@{/vendor/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md">Dashboard</span>
        </a>
        <a th:href="@{/vendor/products}"
           th:classappend="${activePage == 'products'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">inventory_2</span>
            <span class="font-label-md">My Products</span>
        </a>
        <a th:href="@{/vendor/products/new}"
           th:classappend="${activePage == 'new-product'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">add_circle</span>
            <span class="font-label-md">Add Product</span>
        </a>
        <a th:href="@{/vendor/orders}"
           th:classappend="${activePage == 'orders'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">package</span>
            <span class="font-label-md">Orders</span>
        </a>
        <a class="text-on-surface-variant hover:bg-primary/10 hover:text-primary rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all" href="#">
            <span class="material-symbols-outlined">analytics</span>
            <span class="font-label-md">Analytics</span>
        </a>
        <a th:href="@{/vendor/earnings}"
           th:classappend="${activePage == 'earnings'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">payments</span>
            <span class="font-label-md">Earnings</span>
        </a>
        <div class="my-xs border-t border-outline-variant mx-4"></div>
        <a th:href="@{/vendor/settings}"
           th:classappend="${activePage == 'settings'} ? 'bg-primary text-on-primary shadow-md shadow-primary/20' : 'text-on-surface-variant hover:bg-primary/10 hover:text-primary'"
           class="rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all">
            <span class="material-symbols-outlined">manage_accounts</span>
            <span class="font-label-md">Store Settings</span>
        </a>
        <a class="text-on-surface-variant hover:bg-primary/10 hover:text-primary rounded-lg mx-2 px-4 py-2.5 flex items-center gap-3 transition-all" href="#">
            <span class="material-symbols-outlined">help</span>
            <span class="font-label-md">Support</span>
        </a>
    </nav>
    <div class="p-md border-t border-outline-variant/30">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="w-full py-2.5 flex items-center gap-3 text-error font-label-md hover:bg-error/5 rounded-lg transition-all px-4">
                <span class="material-symbols-outlined">logout</span>
                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>

<script>
function openSidebar() {
    document.getElementById('sidebar').classList.add('sidebar-open');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('sidebar-open');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    document.body.style.overflow = '';
}
</script>

</th:block>
</html>
