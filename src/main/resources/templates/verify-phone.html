<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Phone — NaijaMart</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a00 0%, #3d1f08 40%, #6b3a1f 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: #ff8c00; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #c0392b; bottom: -80px; right: -60px; animation-delay: -3s; }
        .orb-3 { width: 200px; height: 200px; background: #e67e22; top: 50%; left: 50%; animation-delay: -6s; }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-30px) scale(1.07); }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 400px;
            animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
            text-align: center;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo { margin-bottom: 28px; }
        .logo span { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .logo span em { color: #ff8c00; font-style: normal; }

        .phone-icon {
            width: 64px; height: 64px;
            background: rgba(255,140,0,0.15);
            border: 2px solid rgba(255,140,0,0.4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }

        h2 { color: #fff; font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
        p.sub { color: rgba(255,255,255,0.55); font-size: 0.875rem; margin-bottom: 28px; line-height: 1.5; }
        p.sub strong { color: rgba(255,255,255,0.8); }

        .alert {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 0.875rem;
            text-align: left;
        }
        .alert-error { background: rgba(220,53,69,0.2); border: 1px solid rgba(220,53,69,0.4); color: #ff8080; }
        .alert-info  { background: rgba(13,110,253,0.15); border: 1px solid rgba(13,110,253,0.3); color: #7db8ff; }

        .otp-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .otp-box {
            width: 48px; height: 56px;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            caret-color: #ff8c00;
            transition: border-color 0.2s, background 0.2s;
        }
        .otp-box:focus { border-color: #ff8c00; background: rgba(255,255,255,0.15); }
        .otp-box.filled { border-color: #ff8c00; }

        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #ff8c00, #e65c00);
            color: #fff; font-size: 1rem; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .resend { margin-top: 20px; }
        .resend a { color: #ff8c00; text-decoration: none; font-size: 0.875rem; }
        .resend a:hover { text-decoration: underline; }
        .resend span { color: rgba(255,255,255,0.45); font-size: 0.875rem; }

        .timer { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 8px; }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
    <div class="logo"><span>Naija<em>Mart</em></span></div>

    <div class="phone-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff8c00" stroke-width="2" stroke-linecap="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
    </div>

    <h2>Verify Your Number</h2>
    <p class="sub">We sent a 6-digit code to<br/><strong th:text="${phone}">+2348000000000</strong></p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${info}"  class="alert alert-info"  th:text="${info}"></div>

    <form id="otpForm" th:action="@{/register/phone/verify}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" id="otpHidden" name="otp" value=""/>

        <div class="otp-row" id="otpRow">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1"/>
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1"/>
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1"/>
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1"/>
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1"/>
        </div>

        <button type="submit" class="btn" id="verifyBtn" disabled>Verify &amp; Create Account</button>
    </form>

    <div class="resend">
        <span>Didn't receive it?</span>
        <form th:action="@{/register/phone/resend}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;cursor:pointer;color:#ff8c00;font-size:0.875rem;padding:0 0 0 6px;"
                    id="resendBtn">Resend code</button>
        </form>
    </div>
    <div class="timer" id="timer"></div>
</div>

<script>
    const boxes = Array.from(document.querySelectorAll('.otp-box'));
    const hidden = document.getElementById('otpHidden');
    const btn = document.getElementById('verifyBtn');

    boxes.forEach((box, i) => {
        box.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
        });
        box.addEventListener('input', e => {
            const val = e.target.value.replace(/\D/g, '').slice(-1);
            box.value = val;
            box.classList.toggle('filled', !!val);
            if (val && i < boxes.length - 1) boxes[i + 1].focus();
            syncHidden();
        });
        box.addEventListener('paste', e => {
            e.preventDefault();
            const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
            digits.split('').forEach((d, j) => {
                if (boxes[j]) { boxes[j].value = d; boxes[j].classList.add('filled'); }
            });
            if (digits.length < 6) boxes[digits.length].focus();
            syncHidden();
        });
    });

    function syncHidden() {
        const code = boxes.map(b => b.value).join('');
        hidden.value = code;
        btn.disabled = code.length < 6;
    }

    // Countdown timer: 10 minutes
    let seconds = 600;
    const timerEl = document.getElementById('timer');
    const resendBtn = document.getElementById('resendBtn');
    resendBtn.disabled = true;
    resendBtn.style.opacity = '0.4';

    const tick = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
            clearInterval(tick);
            timerEl.textContent = 'Code expired. Please request a new one.';
            resendBtn.disabled = false;
            resendBtn.style.opacity = '';
            return;
        }
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `Code expires in ${m}:${s}`;
        if (seconds <= 30) { timerEl.style.color = '#ff8080'; resendBtn.disabled = false; resendBtn.style.opacity = ''; }
    }, 1000);

    boxes[0].focus();
</script>
</body>
</html>
