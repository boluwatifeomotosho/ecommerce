<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account — NaijaMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a0a00 0%, #3d2000 50%, #6b3a1f 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; overflow: hidden;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .25; pointer-events: none; animation: orbFloat 8s ease-in-out infinite; }
        .orb-1 { width: 360px; height: 360px; background: #c4622d; top: -80px; right: -80px; }
        .orb-2 { width: 280px; height: 280px; background: #6b3a1f; bottom: -60px; left: -60px; animation-delay: -3s; }
        .orb-3 { width: 180px; height: 180px; background: #e8a87c; top: 50%; left: 10%; animation-delay: -5s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33%  { transform: translate(20px,-20px) scale(1.05); }
            66%  { transform: translate(-15px,10px) scale(.95); }
        }

        .card {
            background: white; border-radius: 20px; padding: 40px 40px 36px;
            width: 100%; max-width: 420px;
            box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
            position: relative; z-index: 1;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand { text-align: center; margin-bottom: 28px; }
        .brand-mark {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #6b3a1f, #c4622d);
            border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 10px; box-shadow: 0 8px 24px rgba(196,98,45,.4);
        }
        .brand-mark svg { width: 26px; height: 26px; fill: white; }
        .brand h1 { font-size: 20px; font-weight: 700; color: #1a0a00; letter-spacing: -.5px; }

        h2 { font-size: 19px; font-weight: 600; color: #1a0a00; text-align: center; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 28px; }

        .option-btn {
            display: flex; align-items: center; gap: 14px;
            width: 100%; padding: 16px 18px;
            border: 1.5px solid #e5e7eb; border-radius: 12px;
            background: #fafafa; cursor: pointer;
            text-decoration: none; color: inherit;
            transition: border-color .15s, background .15s, box-shadow .15s, transform .1s;
            margin-bottom: 12px;
        }
        .option-btn:hover {
            border-color: #c4622d;
            background: white;
            box-shadow: 0 4px 16px rgba(196,98,45,.12);
            transform: translateY(-1px);
        }
        .option-btn:active { transform: translateY(0); }

        .option-icon {
            width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .option-icon.email { background: rgba(107,58,31,.1); }
        .option-icon.phone { background: rgba(196,98,45,.1); }
        .option-icon.vendor { background: rgba(22,163,74,.1); }

        .option-text { text-align: left; }
        .option-title { font-size: 14px; font-weight: 600; color: #1a0a00; margin-bottom: 2px; }
        .option-desc  { font-size: 12px; color: #9ca3af; }

        .option-arrow { margin-left: auto; color: #d1d5db; flex-shrink: 0; transition: color .15s, transform .15s; }
        .option-btn:hover .option-arrow { color: #c4622d; transform: translateX(3px); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0;
        }
        .divider hr { flex: 1; border: none; border-top: 1px solid #e5e7eb; }
        .divider span { font-size: 12px; color: #9ca3af; white-space: nowrap; }

        .vendor-note {
            margin-top: 4px;
            padding: 12px 14px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            font-size: 12px;
            color: #16a34a;
            text-align: center;
        }

        .footer { text-align: center; font-size: 13px; color: #6b7280; margin-top: 20px; }
        .footer a { color: #6b3a1f; font-weight: 600; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .card { padding: 32px 22px; }
        }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24"><path d="M4 19h16v2H4v-2zm15-9h1c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-1.32A4.99 4.99 0 0 1 14 21H8a5 5 0 0 1-5-5V4h16v6zm0 5h1v-3h-1v3z"/></svg>
        </div>
        <h1>NaijaMart</h1>
    </div>

    <h2>Create your account</h2>
    <p class="subtitle">Choose how you'd like to register</p>

    <!-- Email & Password → Keycloak registration -->
    <a th:href="@{/register/customer}" class="option-btn">
        <div class="option-icon email">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b3a1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
        </div>
        <div class="option-text">
            <div class="option-title">Email &amp; Password</div>
            <div class="option-desc">Register with your email address</div>
        </div>
        <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </a>

    <div class="divider">
        <hr/><span>or</span><hr/>
    </div>

    <!-- Phone & OTP → Spring Boot flow -->
    <a th:href="@{/register/phone}" class="option-btn">
        <div class="option-icon phone">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c4622d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
        </div>
        <div class="option-text">
            <div class="option-title">Phone &amp; OTP</div>
            <div class="option-desc">Register with your mobile number</div>
        </div>
        <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </a>

    <div class="divider">
        <hr/><span>selling on NaijaMart?</span><hr/>
    </div>

    <!-- Vendor registration -->
    <a th:href="@{/register/vendor}" class="option-btn">
        <div class="option-icon vendor">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <div class="option-text">
            <div class="option-title">Become a Vendor</div>
            <div class="option-desc">Register a seller account for your business</div>
        </div>
        <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </a>

    <div class="footer">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
