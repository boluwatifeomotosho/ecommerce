<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In with Phone — Pinepetosan Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a0a00 0%, #3d2000 50%, #6b3a1f 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; overflow: hidden;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .25; pointer-events: none; animation: orbFloat 8s ease-in-out infinite; }
        .orb-1 { width: 360px; height: 360px; background: #c4622d; top: -80px; right: -80px; }
        .orb-2 { width: 280px; height: 280px; background: #6b3a1f; bottom: -60px; left: -60px; animation-delay: -3s; }
        .orb-3 { width: 180px; height: 180px; background: #e8a87c; top: 50%; left: 10%; animation-delay: -5s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33%  { transform: translate(20px,-20px) scale(1.05); }
            66%  { transform: translate(-15px,10px) scale(.95); }
        }

        .card {
            background: white; border-radius: 20px; padding: 40px 40px 36px;
            width: 100%; max-width: 400px;
            box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
            position: relative; z-index: 1; text-align: center;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-mark {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #6b3a1f, #c4622d);
            border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 10px; box-shadow: 0 8px 24px rgba(196,98,45,.4);
        }
        .brand-mark svg { width: 26px; height: 26px; fill: white; }
        .brand-name { font-size: 20px; font-weight: 700; color: #1a0a00; letter-spacing: -.5px; margin-bottom: 24px; }

        .phone-icon {
            width: 60px; height: 60px;
            background: rgba(196,98,45,.1); border: 2px solid rgba(196,98,45,.3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
        }

        h2 { font-size: 18px; font-weight: 600; color: #1a0a00; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }

        .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; text-align: left; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

        .field { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        input[type="tel"] {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #d1d5db; border-radius: 8px;
            font-size: 15px; font-family: inherit; color: #111827;
            background: #f9fafb; outline: none;
            transition: border-color .15s, background .15s, box-shadow .15s;
        }
        input[type="tel"]:focus { border-color: #c4622d; background: white; box-shadow: 0 0 0 3px rgba(196,98,45,.12); }
        input[type="tel"].valid   { border-color: #16a34a; }
        input[type="tel"].invalid { border-color: #dc2626; }

        .hint { font-size: 12px; color: #dc2626; margin-top: 4px; display: none; }
        .hint.show { display: block; }

        .btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #6b3a1f, #c4622d);
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
            box-shadow: 0 4px 16px rgba(196,98,45,.3);
            transition: opacity .15s, transform .1s;
        }
        .btn:hover:not(:disabled) { opacity: .92; }
        .btn:active:not(:disabled) { transform: scale(.99); }
        .btn:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; box-shadow: none; }

        .back { margin-top: 20px; font-size: 13px; color: #6b7280; }
        .back a { color: #6b3a1f; font-weight: 600; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
    <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 19h16v2H4v-2zm15-9h1c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-1.32A4.99 4.99 0 0 1 14 21H8a5 5 0 0 1-5-5V4h16v6zm0 5h1v-3h-1v3z"/></svg>
    </div>
    <div class="brand-name">Pinepetosan Marketplace</div>

    <div class="phone-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c4622d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
    </div>

    <h2>Sign in with Phone</h2>
    <p class="sub">Enter your registered phone number and we'll send you a one-time code.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/login/phone}" method="post" id="loginForm" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="08012345678 or +2348012345678"
                   required autocomplete="tel"/>
            <div class="hint" id="phoneHint">Enter a valid Nigerian mobile number</div>
        </div>

        <button type="submit" class="btn" id="submitBtn" disabled>Send OTP</button>
    </form>

    <div class="back">
        <a th:href="@{/login}">&#8592; Back to sign in options</a>
    </div>
</div>

<script>
    const PHONE_RE = /^(\+?234|0)[789]\d{9}$/;
    const phoneEl  = document.getElementById('phone');
    const hintEl   = document.getElementById('phoneHint');
    const submitEl = document.getElementById('submitBtn');

    phoneEl.addEventListener('input', () => {
        const v     = phoneEl.value.trim().replace(/\s/g, '');
        const valid = PHONE_RE.test(v);
        phoneEl.classList.toggle('valid',   v.length > 3 &&  valid);
        phoneEl.classList.toggle('invalid', v.length > 3 && !valid);
        hintEl.classList.toggle('show', v.length > 3 && !valid);
        submitEl.disabled = !valid;
    });
</script>
</body>
</html>
